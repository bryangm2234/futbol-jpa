<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Editar Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container py-4" style="max-width:700px">

    <h3 class="mb-1">Editar Club: <strong th:text="${club.nombre}"></strong></h3>
    <p class="text-muted mb-4">Agrega nuevos jugadores al plantel existente.</p>

    <!-- Jugadores actuales -->
    <div class="card mb-4">
        <div class="card-header bg-success text-white">Plantel actual</div>
        <div class="card-body p-2">
            <div th:if="${club.jugadores.empty}" class="text-muted p-2">Sin jugadores aún.</div>
            <table th:unless="${club.jugadores.empty}" class="table table-sm mb-0">
                <thead><tr><th>#</th><th>Nombre</th><th>Posición</th></tr></thead>
                <tbody>
                    <tr th:each="j : ${club.jugadores}">
                        <td th:text="${j.numero}"></td>
                        <td th:text="${j.nombre + ' ' + j.apellido}"></td>
                        <td th:text="${j.posicion}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Formulario agregar jugadores -->
    <div class="card">
        <div class="card-header bg-secondary text-white">Agregar Jugadores</div>
        <div class="card-body">
            <form th:action="@{/clubes/editar/{id}(id=${club.id})}" method="post">
                <div id="jugadores-container" class="d-flex flex-column gap-2 mb-3"></div>
                <button type="button" class="btn btn-outline-success btn-sm mb-3"
                        onclick="agregarJugador()">
                    <i class="bi bi-person-plus me-1"></i>Agregar jugador
                </button>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-save me-1"></i>Guardar
                    </button>
                    <a th:href="@{/clubes/listar}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
let idx = 0;
function agregarJugador() {
    const c = document.getElementById('jugadores-container');
    const d = document.createElement('div');
    d.className = 'border rounded p-2 bg-white';
    d.innerHTML = `
        <div class="row g-2">
            <div class="col-sm-6"><input type="text" name="jugadorNombre" class="form-control form-control-sm" placeholder="Nombre *" required/></div>
            <div class="col-sm-6"><input type="text" name="jugadorApellido" class="form-control form-control-sm" placeholder="Apellido"/></div>
            <div class="col-sm-4"><input type="number" name="jugadorNumero" class="form-control form-control-sm" placeholder="# Camiseta" min="1" max="99"/></div>
            <div class="col-sm-6">
                <select name="jugadorPosicion" class="form-select form-select-sm">
                    <option value="">— Posición —</option>
                    <option>Portero</option><option>Defensa Central</option>
                    <option>Lateral Derecho</option><option>Lateral Izquierdo</option>
                    <option>Mediocampista</option><option>Mediocampista Ofensivo</option>
                    <option>Extremo Derecho</option><option>Extremo Izquierdo</option>
                    <option>Delantero Centro</option>
                </select>
            </div>
            <div class="col-sm-2 d-flex align-items-center">
                <button type="button" class="btn btn-sm btn-outline-danger w-100" onclick="this.closest('div.border').remove()">
                    <i class="bi bi-x"></i>
                </button>
            </div>
        </div>`;
    c.appendChild(d);
    idx++;
}
// Agregar una fila automáticamente al cargar
agregarJugador();
</script>
</body>
</html>
